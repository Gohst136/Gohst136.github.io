plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
evaluationDependsOn(':core')
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'planetary'
            if (project.hasProperty('autotest')) { systemProperty 'planetary.autotest', 'true'; programArguments.addAll('--width', '1280', '--height', '720') }
        }
    }
    mods { planetary { sourceSet sourceSets.main; sourceSet project(':core').sourceSets.main } }
}
dependencies { implementation project(':core') }
